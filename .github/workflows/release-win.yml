name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 4.2.3。留空时用 tag 去掉 v 前缀的版本（tag 触发）或 package.json 里的版本'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=$(node -p "require('./packages/bruno-electron/package.json').version")
          fi
          echo "Building version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        shell: bash

      - name: Build libraries
        run: |
          npm run build:graphql-docs
          npm run build:bruno-query
          npm run build:bruno-common
          npm run sandbox:bundle-libraries --workspace=packages/bruno-js
          npm run build:bruno-converters
          npm run build:bruno-requests
          npm run build:schema-types
          npm run build:bruno-filestore
          npm run build:bruno-sqlite
        shell: bash

      - name: Build web app
        run: npm run build:web
        shell: bash
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Set app version
        run: npm pkg set version="$VERSION"
        working-directory: packages/bruno-electron
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build Electron (Windows)
        # npm 在 Windows 上用 cmd.exe 执行 script，跑不了 .sh，所以直接调 bash
        run: bash ./scripts/build-electron.sh win
        shell: bash
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bruno-windows
          path: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.yml
          if-no-files-found: error

      - name: Upload artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.yml
